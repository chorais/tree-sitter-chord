[package]
authors = [ "figurativelycthulhu <figurativelycthulhu@outlook.com>" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "Chorais Description Langauge for AI orchestration"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "chord" ]
license = "MIT"
name = "tree-sitter-chord"
repository = "https://github.com/chorais/chorais"
version = "0.1.0"

# Kept as a self-contained crate under bindings/rust/ rather than at the repo
# root: Zed's dev-extension install treats any Cargo.toml at the extension root
# as a Rust WASM extension and fails to build it.

build = "build.rs"

[lib]
path = "lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.2"
